# ───────────────────────────────────────────────────────────────
# AI Model Explorer · nginx 虚拟主机（静态站点）
# 部署位置（海外服务器）：/etc/nginx/sites-available/ai-model-explorer.conf
# 软链：ln -s /etc/nginx/sites-available/ai-model-explorer.conf /etc/nginx/sites-enabled/
# 约定：xray 在 443 终止 TLS 后转发到本 nginx(:80)，对齐 www.hush7.online 模式。
# ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name models.hush7.online;   # ← 换成你的子域名

    root /var/www/ai-model-explorer;   # ← 与 deploy.sh 的 DEPLOY_PATH 一致
    index index.html;

    # 纯静态 + hash 路由（# 路由无需服务端 rewrite，兜底仍指回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 数据 JSON：允许缓存 1h（更新后部署即刷新）
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # 静态资源长效缓存
    location ~* \.(js|css|svg|png|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    access_log /var/log/nginx/ai-model-explorer.access.log;
    error_log  /var/log/nginx/ai-model-explorer.error.log;
}
