name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # 数据更新自动化：每周一 09:17 跑一次数据质量复核（仅提示，不阻断 push）
  schedule:
    - cron: '17 9 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check app.js + src modules
        run: |
          node --check app.js
          for f in src/*.js; do
            node --check "$f"
          done

      - name: Validate normalized data (zero-dependency)
        run: node scripts/validate_normalized.cjs

  data-quality:
    # 仅定时任务运行；push/PR 不触发，避免阻塞合入
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 数据质量复核（检测过期/缺失字段）
        run: python3 scripts/model_quality_check.py

  # 真实浏览器 E2E 回归门禁：补 JSDOM 冒烟抓不到的真渲染 / 真点击 / 控制台报错问题
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: 启动静态服务并跑 E2E
        run: |
          python3 -m http.server 8848 &
          SRV=$!
          sleep 2
          node scripts/e2e.cjs
          RC=$?
          kill $SRV
          exit $RC
