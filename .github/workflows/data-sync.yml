name: Data Sync

# Phase 2/3/4 —— 自动开 PR + 受限安全自动合并 + 13 家厂商 + 健康监控 + 自动部署
# 行为：
#   1) 跑启用源 Collector（13 家）→ Schema 校验 → 差异报告 → 健康监控报告
#   2) 有「字段变动」默认自动开 PR（data-sync/<date> → master，人审后 merge）；
#      当 workflow_dispatch 开启 auto_merge_safe 且 diff 纯为价格/辅助字段变动、无新增/弃用/失败源时，直接合入 master（绕过 PR，自动合并，默认关）
#   3) 监控发现 error 级告警 → 建「健康告警」Issue（数据诚信问题，如 free 标注与官方定价冲突）
#   4) push 到 master（PR 合并 / 安全自动合并后）或手动勾选 deploy → 自动 rsync 部署到海外服务器（闭环）
# 关键约束：默认不开自动合并、不自动部署；free / 定性字段始终不碰（apply_staging 已拦截）。
on:
  schedule:
    - cron: '23 3 * * 1'          # 每周一 03:23 UTC（避开整点，非每日）
  push:
    branches: [master]            # 合并/安全合并后触发自动部署（闭环）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅生成差异报告 + 建 Issue 通知，不开 PR'
        type: boolean
        default: false
      auto_merge_safe:
        description: '安全自动合并：仅当 diff 纯为价格/辅助字段变动时直接合 master（默认关，需人审时留 false）'
        type: boolean
        default: false
      deploy:
        description: '采集后直接部署到海外服务器（需配置 DEPLOY_HOST 等 secret）'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行 Collectors（启用源，含 Cloudflare / HuggingFace）
        run: node scripts/run_collectors.cjs

      - name: Schema 校验（失败即阻断）
        run: node scripts/validate_schema.cjs

      - name: 生成差异报告
        run: node scripts/diff_data.cjs

      - name: 健康监控（只读，产出 HEALTH_REPORT / health.json）
        run: node scripts/monitor.cjs

      - name: 健康告警 Issue（仅 error 级）
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const h=require('./data/.staging/health.json');process.exit(h.summary.error>0?0:1)" && \
          gh issue create --title "数据健康告警 $(date +%F)" \
            --body "$(cat data/.staging/HEALTH_REPORT.md)" || true

      - name: 配置 git 身份与远端（stage_pr commit/push 需要，早于自动开 PR 步骤）
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.dry_run && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: 自动开 PR / 安全自动合并
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.dry_run && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage_pr.cjs --create ${{ inputs.auto_merge_safe == true && '--auto-merge-safe' || '' }}

      - name: 仅报告模式（dry_run，不开 PR）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage_pr.cjs --create --issue-only

      - name: 异常告警
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "数据同步异常 $(date +%F)" --body "见 run log" || true

      - name: 提交监控状态（跨次持久化连续失败计数）
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/_monitor_state.json
          if git diff --cached --quiet; then
            echo "监控状态无变化，跳过提交"
          else
            git commit -m "chore: update monitor state [skip ci]" && git push
          fi

  deploy:
    needs: [collect]
    # 关键修复：采集(collect)失败不应阻断站点部署。always() 保证 push 到 master 时
    # 无论 collect 成功/失败，deploy 都会执行 rsync，确保站点文件始终上服务器。
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装部署密钥
        if: ${{ env.DEPLOY_HOST != '' }}
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/id_ed25519 <<< "${{ secrets.DEPLOY_KEY }}"
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 部署到海外服务器 (rsync)
        if: ${{ env.DEPLOY_HOST != '' }}
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ~/.ssh/id_ed25519
        run: bash scripts/deploy.sh

      - name: 跳过部署（未配置 DEPLOY_HOST secret）
        if: ${{ env.DEPLOY_HOST == '' }}
        run: echo "未配置 DEPLOY_HOST secret，跳过自动部署（本地可手动 npm run deploy）。"
