name: Data Sync

# Phase 2 —— 自动开 PR（不自动合并）+ 扩展 Cloudflare / HuggingFace
# 行为：跑启用源 Collector（含 Cloudflare / HuggingFace）→ Schema 校验 → 差异报告 →
#       有「字段变动」自动开 PR（data-sync/<date> → master，人审后 merge）；
#       仅「新增候选 / 失败源」退化建 Issue 通知；异常仍建 Issue 告警。
# 关键约束：自动开 PR、不自动合并、不自动部署；free / 定性字段始终不碰（apply_staging 已拦截）。
on:
  schedule:
    - cron: '23 3 * * 1'          # 每周一 03:23 UTC（避开整点，非每日）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅生成差异报告 + 建 Issue 通知，不开 PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行 Collectors（启用源，含 Cloudflare / HuggingFace）
        run: node scripts/run_collectors.cjs

      - name: Schema 校验（失败即阻断）
        run: node scripts/validate_schema.cjs

      - name: 生成差异报告
        run: node scripts/diff_data.cjs

      - name: 自动开 PR（不自动合并）
        if: ${{ !inputs.dry_run && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage_pr.cjs --create

      - name: 仅报告模式（dry_run，不开 PR）
        if: ${{ inputs.dry_run && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage_pr.cjs --create --issue-only

      - name: 异常告警
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "数据同步异常 $(date +%F)" --body "见 run log" || true
