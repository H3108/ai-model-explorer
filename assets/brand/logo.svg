<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="AI Model Explorer">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#1f4d42"/>
      <stop offset="0.7" stop-color="#173e35"/>
      <stop offset="1" stop-color="#0e2a24"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 轨道环（深绿） -->
  <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(-24 60 60)" stroke="#173e35" stroke-opacity="0.30" stroke-width="1.6"/>
  <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(28 60 60)" stroke="#173e35" stroke-opacity="0.24" stroke-width="1.6"/>
  <ellipse cx="60" cy="60" rx="20" ry="46" transform="rotate(12 60 60)" stroke="#173e35" stroke-opacity="0.18" stroke-width="1.4"/>

  <!-- 连接线：核心到各节点（深绿） -->
  <g stroke="#173e35" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="60" y1="60" x2="102" y2="60"/>
    <line x1="60" y1="60" x2="90" y2="90"/>
    <line x1="60" y1="60" x2="60" y2="102"/>
    <line x1="60" y1="60" x2="30" y2="90"/>
    <line x1="60" y1="60" x2="18" y2="60"/>
    <line x1="60" y1="60" x2="30" y2="30"/>
    <line x1="60" y1="60" x2="60" y2="18"/>
    <line x1="60" y1="60" x2="90" y2="30"/>
  </g>
  <!-- 节点间网状连线（中绿） -->
  <g stroke="#63933a" stroke-opacity="0.30" stroke-width="1.1">
    <line x1="102" y1="60" x2="90" y2="90"/>
    <line x1="90" y1="90" x2="60" y2="102"/>
    <line x1="60" y1="102" x2="30" y2="90"/>
    <line x1="30" y1="90" x2="18" y2="60"/>
    <line x1="18" y1="60" x2="30" y2="30"/>
    <line x1="30" y1="30" x2="60" y2="18"/>
    <line x1="60" y1="18" x2="90" y2="30"/>
    <line x1="90" y1="30" x2="102" y2="60"/>
    <line x1="90" y1="30" x2="30" y2="90"/>
  </g>

  <!-- 环绕节点（浅绿 #baf17a，网站浅绿） -->
  <g filter="url(#glow)">
    <circle cx="102" cy="60" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="90" cy="90" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="60" cy="102" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="30" cy="90" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="18" cy="60" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="30" cy="30" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="60" cy="18" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
    <circle cx="90" cy="30" r="6.5" fill="#baf17a" stroke="#63933a" stroke-width="1.2"/>
  </g>

  <!-- 中央核心（深绿 #173e35，网站深绿） -->
  <circle cx="60" cy="60" r="14" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="14" fill="none" stroke="#baf17a" stroke-opacity="0.6" stroke-width="1.4"/>
  <circle cx="55" cy="54" r="3.4" fill="#baf17a" fill-opacity="0.85"/>
</svg>
